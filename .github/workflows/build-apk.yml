name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main, master] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # The GitHub Ubuntu runner already ships with the Android SDK (ANDROID_HOME), so no separate SDK setup step is needed.
      - run: npm install
      - run: npm run apk
      - uses: actions/upload-artifact@v4
        with: { name: quick-coffee-pos-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
