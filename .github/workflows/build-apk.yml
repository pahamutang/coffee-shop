name: Build APK
on: { workflow_dispatch: {}, push: { branches: [main, master] } }
concurrency: { group: build-apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CAPACITOR_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # The GitHub Ubuntu runner already ships with the Android SDK, so no separate SDK setup step is needed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web app
        run: npm run build
      - name: Sync to Android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: quick-coffee-pos-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
